internal_name: gpt-5.6-sol
provider: openai
pricing:
  # OpenAI's published rates (developers.openai.com/api/docs/pricing). Sol has
  # no context-length tiers, unlike gpt-5.5, so no prompt_tiers here.
  input: 4.00
  output: 20.00
  cache_read: 0.40
  cache_write: 0
aliases:
  - sol
  - gpt-5.6-sol
provider_slugs:
  portkey: "@openai/gpt-5.6-sol"

# Endpoints resolve against the CLI provider, not this config's provider.
# Use --model portkey/gpt-5.6-sol to route Codex through the Portkey gateway.
agent_specific:
  codex:
    endpoint: openai
    thinking: high
