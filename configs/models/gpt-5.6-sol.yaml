internal_name: gpt-5.6-sol
provider: openai
pricing:
  # Prompts above 272k input tokens use 2x input and 1.5x output pricing.
  input: 8.00
  output: 30.00
  cache_read: 0.80
  cache_write: 10.00
  prompt_tiers:
    - max_input_tokens: 272000
      input: 4.00
      output: 20.00
      cache_read: 0.40
      cache_write: 5.00
aliases:
  - sol
  - gpt-5.6-sol
provider_slugs:
  # Portkey model-catalog slug: "@<integration>/<model>", where <integration>
  # is the provider integration name in your Portkey workspace.
  portkey: "@openai/gpt-5.6-sol"

# Endpoints resolve against the CLI provider, not this config's provider.
# Use --model portkey/gpt-5.6-sol to route Codex through the Portkey gateway.
agent_specific:
  codex:
    endpoint: openai
    thinking: high
